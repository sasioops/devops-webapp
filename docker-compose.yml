version: "3.9"

services:

  # ── Python FastAPI application ──────────────────────────────────────────────
  app:
    build:
      context: .
      dockerfile: Dockerfile
    image: devops-webapp:latest
    container_name: devops-webapp-app
    environment:
      APP_ENV: production
    restart: unless-stopped
    expose:
      - "8000"          # internal only — Nginx is the public face
    healthcheck:
      test: ["CMD", "python", "-c",
             "import urllib.request; urllib.request.urlopen('http://localhost:8000/api/health')"]
      interval: 30s
      timeout: 5s
      retries: 3
    networks:
      - webapp-net

  # ── Nginx reverse proxy ─────────────────────────────────────────────────────
  nginx:
    image: nginx:1.25-alpine
    container_name: devops-webapp-nginx
    ports:
      - "80:80"         # ← hit http://localhost to reach the app
    volumes:
      - ./nginx/nginx.conf:/etc/nginx/conf.d/default.conf:ro
    depends_on:
      app:
        condition: service_healthy
    restart: unless-stopped
    networks:
      - webapp-net

networks:
  webapp-net:
    driver: bridge
