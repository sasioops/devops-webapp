services:
  app:
    build: .
    image: flask-webapp:latest
    container_name: flask-webapp-app
    environment:
      FLASK_ENV: production
    restart: unless-stopped
    expose:
      - "8000"
    healthcheck:
      test: ["CMD", "python", "-c",
             "import urllib.request; urllib.request.urlopen('http://localhost:8000/api/health')"]
      interval: 30s
      timeout: 5s
      retries: 3
    networks:
      - webapp-net

  nginx:
    image: nginx:1.25-alpine
    container_name: flask-webapp-nginx
    ports:
      - "80:80"
    volumes:
      - ./nginx/nginx.conf:/etc/nginx/conf.d/default.conf:ro
    depends_on:
      app:
        condition: service_healthy
    restart: unless-stopped
    networks:
      - webapp-net

networks:
  webapp-net:
    driver: bridge