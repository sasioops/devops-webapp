# nginx/nginx.conf
# Nginx acts as a reverse proxy in front of the FastAPI (uvicorn) app.

upstream fastapi_app {
    server app:8000;          # "app" is the docker-compose service name
    keepalive 32;
}

server {
    listen 80;
    server_name _;

    # ── Security headers ──────────────────────────────────────────────────────
    add_header X-Frame-Options        "DENY"            always;
    add_header X-Content-Type-Options "nosniff"         always;
    add_header X-XSS-Protection       "1; mode=block"   always;
    add_header Referrer-Policy        "no-referrer"     always;

    # ── Proxy all /api/* traffic to FastAPI ───────────────────────────────────
    location /api/ {
        proxy_pass         http://fastapi_app;
        proxy_http_version 1.1;
        proxy_set_header   Host              $host;
        proxy_set_header   X-Real-IP         $remote_addr;
        proxy_set_header   X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header   X-Forwarded-Proto $scheme;
        proxy_set_header   Connection        "";
        proxy_read_timeout 60s;
    }

    # ── Forward /docs and /openapi.json to FastAPI ────────────────────────────
    location ~ ^/(docs|redoc|openapi\.json) {
        proxy_pass         http://fastapi_app;
        proxy_http_version 1.1;
        proxy_set_header   Host $host;
    }

    # ── Serve static files (if any) ───────────────────────────────────────────
    location / {
        root  /usr/share/nginx/html;
        index index.html;
        try_files $uri $uri/ =404;
    }

    # ── Nginx status endpoint (for monitoring) ────────────────────────────────
    location /nginx-status {
        stub_status on;
        allow 127.0.0.1;
        deny  all;
    }
}
